<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f1fa;
        color: #4d3d60;
        font: 14px "Microsoft YaHei UI";
      }
      aside {
        width: 320px;
        padding: 22px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 15px;
      }
      p {
        line-height: 1.7;
      }
      button {
        background: white;
        border: 1px solid #dfd1ec;
        border-radius: 8px;
        color: inherit;
        padding: 9px 14px;
        margin: 3px;
        cursor: pointer;
        font: inherit;
      }
      input {
        width: 270px;
        padding: 12px;
        border: 1px solid #a58bc5;
        border-radius: 6px;
        font: inherit;
      }
      #surface {
        position: fixed;
        left: 330px;
        top: 15px;
        right: 15px;
        bottom: 15px;
        border: 1px solid #cfc0de;
        border-radius: 16px;
        background: repeating-conic-gradient(#f7f4fa 0 25%, #eae3f1 0 50%)
          0/32px 32px;
      }
      #surface span {
        display: block;
        margin: 18px;
        line-height: 1.8;
        color: #8d78a4;
      }
      #status {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 12px/1.5 Consolas;
        padding-top: 12px;
        max-height: 280px;
        overflow: auto;
      }
      #count {
        padding-top: 12px;
      }
    </style>
    <title>GPT 娘 · JavaScript 交互验证台</title>
  </head>
  <body>
    <div id="surface">
      <span
        >独立的模拟宿主<br />透明处的点击应落到本窗口<br />角色、气泡和右键菜单由
        JS 候选版绘制</span
      >
    </div>
    <aside>
      <h1>JavaScript 交互验证台</h1>
      <p>
        这里使用独立设置副本。窗口跟随、透明穿透、拖动和音乐操作可以在此核验。
      </p>
      <button data-command="quota">额度</button
      ><button data-command="quote">语录</button
      ><button data-command="menu">设置</button
      ><button data-command="characters">形象图库</button
      ><button data-command="quotes">我的语录</button><br /><button
        data-command="music"
        data-value="true"
      >
        开启音乐</button
      ><button data-command="music" data-value="false">关闭音乐</button
      ><br /><button data-command="bench-move">移动宿主</button
      ><button data-command="bench-resize">改变宿主大小</button
      ><button data-command="bench-minimize">最小化后恢复</button
      ><button data-command="bench-completion">完成提醒</button>
      <p>先点输入框，再点角色检查焦点：</p>
      <input
        id="focus-test"
        aria-label="焦点验证输入框"
        placeholder="点角色后应继续在这里输入"
      />
      <div id="count">背景点击：0</div>
      <div id="status"></div>
    </aside>
    <script type="module" src="bench.mjs"></script>
  </body>
</html>

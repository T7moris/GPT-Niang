name: JavaScript architecture Beta
on:
  push:
    branches: ['beta/javascript-*']
    paths: ['windows-js/**', '.github/workflows/javascript-beta.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: javascript-beta-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-js:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows-js/package-lock.json
      - name: Install locked dependencies
        working-directory: windows-js
        run: npm ci
      - name: Prepare Electron runtime
        working-directory: windows-js
        run: npm run prepare:runtime
      - name: Compile native helpers
        working-directory: windows-js
        run: npm run compile:native
      - name: Prepare isolated integration test environment
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:GITHUB_WORKSPACE '.ci-tmp'
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
          $cliRoot = Join-Path $env:RUNNER_TEMP 'codex-integration-cli'
          npm install --prefix $cliRoot @openai/codex@0.166.0
          if ($LASTEXITCODE -ne 0) { throw 'Codex integration dependency installation failed' }
          $cli = Get-ChildItem -LiteralPath $cliRoot -Recurse -File -Filter codex.exe | Select-Object -First 1
          if (-not $cli) { throw 'Codex integration executable is missing' }
          "CODEX_CLI_PATH=$($cli.FullName)" >> $env:GITHUB_ENV
      - name: Verify JavaScript architecture
        uses: actions/upload-artifact@v4
        with:
          name: javascript-native-input
          path: windows-js/native/GPTNiang.Input.dll
          if-no-files-found: error
      - name: Verify JavaScript architecture
        working-directory: windows-js
        env:
          GPT_NIANG_LEGACY_ROOT: ../gpt-niang-usage
        run: npm test
      - name: Build clean Beta package
        working-directory: windows-js
        run: npm run package:beta -- --output ../dist/javascript-beta
      - uses: actions/upload-artifact@v4
        with:
          name: javascript-beta-windows
          path: |
            dist/javascript-beta/*.zip
            dist/javascript-beta/SHA256SUMS.txt
            dist/javascript-beta/package-verification.json
          compression-level: 0
          if-no-files-found: error
  publish-beta:
    needs: windows-js
    if: github.ref == 'refs/heads/beta/javascript-1.4.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: javascript-beta-windows
          path: dist
      - name: Publish the verified JavaScript Beta draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./windows-js/package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          tag="v$version"
          (cd dist && sha256sum --check SHA256SUMS.txt)
          test "$(node -p "require('./dist/package-verification.json').sourceCommit")" = "$GITHUB_SHA"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\")" > "$RUNNER_TEMP/beta-release.json"
          jq -s -e 'length == 1' "$RUNNER_TEMP/beta-release.json" >/dev/null
          jq -e '.draft == true and .prerelease == true' "$RUNNER_TEMP/beta-release.json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
          release_id="$(jq -r .id "$RUNNER_TEMP/beta-release.json")"
          while read -r asset_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done < <(jq -r '.assets[].id' "$RUNNER_TEMP/beta-release.json")
          for asset in dist/*-windows-js.zip dist/SHA256SUMS.txt; do
            gh api --method POST -H 'Content-Type: application/octet-stream' --input "$asset" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$(basename "$asset")" --silent
          done
          notes="$RUNNER_TEMP/beta-notes.md"
          cp windows-js/RELEASE_NOTES.md "$notes"
          printf '\n构建检查：[GitHub Actions](%s/%s/actions/runs/%s)。\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$notes"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false -F prerelease=true -f make_latest=false -f "tag_name=$tag" -F "body=@$notes" --silent
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = 'v1.3.6'
